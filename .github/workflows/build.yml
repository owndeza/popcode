name: Build Zed

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Получаем код из репо
      - uses: actions/checkout@v3

      # 2. Устанавливаем системные зависимости для x11
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxcursor-dev pkg-config

      # 3. Устанавливаем системные зависимости для x11 и alsa
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          build-essential \
          pkg-config \
          libx11-dev \
          libx11-xcb-dev \
          libxrandr-dev \
          libxcursor-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libwayland-dev \
          libasound2-dev

      # 4. Кэшируем Cargo registry и git для ускорения сборки
      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      # 5. Обновляем Rust (раннер уже содержит его)
      - name: Ensure Rust is installed
        run: rustup update

      # 6. Сборка проекта
      - name: Build Zed
        run: cargo build --release

      # 7. Загружаем бинарь как артефакт
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zed-release
          path: target/release/zed
